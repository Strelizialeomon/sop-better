name: Mechanical CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  native-tests:
    name: Native tests (${{ matrix.os }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Record the runner's real platform
        run: go env GOOS GOARCH

      - name: Run repository quality gates
        if: runner.os == 'Linux'
        run: |
          git diff-tree --check --root -r HEAD
          go vet ./...

      - name: Run the complete test suite on this runner
        run: go test ./...

      - name: Build and verify a native complete release from real assets
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/quality
          go build -trimpath -buildvcs=false -ldflags=-buildid= \
            -o dist/quality/sopctl ./cmd/sopctl-bootstrap
          go build -trimpath -buildvcs=false \
            -ldflags="-buildid= -X github.com/Strelizialeomon/sop-better/internal/releasemanager.BuildVersion=0.1.0" \
            -o dist/quality/sopctl-manager ./cmd/sopctl-manager
          go build -trimpath -buildvcs=false \
            -ldflags="-buildid= -X github.com/Strelizialeomon/sop-better/internal/releasemanager.BuildVersion=0.1.0" \
            -o dist/quality/sop-install ./cmd/sop-install
          go build -trimpath -buildvcs=false \
            -ldflags="-buildid= -X main.buildVersion=0.1.0" \
            -o dist/quality/sopctl-engine ./cmd/sopctl-engine
          go run ./cmd/sop-release assemble-unverified \
            --source . \
            --plugin-root plugin \
            --output dist/quality/release \
            --version 0.1.0 \
            --tag v0.1.0 \
            --commit "${GITHUB_SHA}" \
            --release-notes "Phase 1 stability candidate from ${GITHUB_SHA}" \
            --upgrade-impact "Updates versioned SOP rules, plugin, manager, and engine; project files remain unchanged until render" \
            --bootstrap-binary dist/quality/sopctl \
            --installer-binary dist/quality/sop-install \
            --manager-binary dist/quality/sopctl-manager \
            --engine-binary dist/quality/sopctl-engine \
            --binary-version 0.1.0 \
            --target-os linux \
            --target-arch "$(go env GOARCH)"
          go run ./cmd/sop-release verify --bundle dist/quality/release

      # The official Codex skill/plugin validators are not vendored or available
      # on hosted runners; final release validation runs them explicitly instead.

  cross-build:
    name: Cross-build only (${{ matrix.target }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            suffix: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            suffix: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            suffix: .exe
          - target: windows-arm64
            goos: windows
            goarch: arm64
            suffix: .exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile without claiming target execution
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags=-buildid= \
            -o "dist/sopctl-${{ matrix.target }}${{ matrix.suffix }}" ./cmd/sopctl-bootstrap
          go build -trimpath -buildvcs=false \
            -ldflags="-buildid= -X github.com/Strelizialeomon/sop-better/internal/releasemanager.BuildVersion=0.1.0" \
            -o "dist/sopctl-manager-${{ matrix.target }}${{ matrix.suffix }}" ./cmd/sopctl-manager
          go build -trimpath -buildvcs=false \
            -ldflags="-buildid= -X github.com/Strelizialeomon/sop-better/internal/releasemanager.BuildVersion=0.1.0" \
            -o "dist/sop-install-${{ matrix.target }}${{ matrix.suffix }}" ./cmd/sop-install
          go build -trimpath -buildvcs=false \
            -ldflags="-buildid= -X main.buildVersion=0.1.0" \
            -o "dist/sopctl-engine-${{ matrix.target }}${{ matrix.suffix }}" ./cmd/sopctl-engine

      - name: Build and verify the complete release unit from real repository assets
        run: |
          go run ./cmd/sop-release assemble-unverified \
            --source . \
            --plugin-root plugin \
            --output "dist/release-${{ matrix.target }}" \
            --version 0.1.0 \
            --tag v0.1.0 \
            --commit "${GITHUB_SHA}" \
            --release-notes "Phase 1 stability candidate from ${GITHUB_SHA}" \
            --upgrade-impact "Updates versioned SOP rules, plugin, manager, and engine; project files remain unchanged until render" \
            --bootstrap-binary "dist/sopctl-${{ matrix.target }}${{ matrix.suffix }}" \
            --installer-binary "dist/sop-install-${{ matrix.target }}${{ matrix.suffix }}" \
            --manager-binary "dist/sopctl-manager-${{ matrix.target }}${{ matrix.suffix }}" \
            --engine-binary "dist/sopctl-engine-${{ matrix.target }}${{ matrix.suffix }}" \
            --binary-version 0.1.0 \
            --target-os "${{ matrix.goos }}" \
            --target-arch "${{ matrix.goarch }}"
          go run ./cmd/sop-release verify --bundle "dist/release-${{ matrix.target }}"

  tagged-release-gate:
    name: Tagged release gate (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on:
      - self-hosted
      - linux
      - sop-release
    env:
      SOP_PLUGIN_VALIDATOR: ${{ vars.SOP_PLUGIN_VALIDATOR }}
      SOP_RUN_REAL_CODEX_PLUGIN_TEST: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
          - target: windows-arm64
            goos: windows
            goarch: arm64
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up uv for the official plugin validator
        uses: astral-sh/setup-uv@v5

      - name: Verify the preprovisioned release runner
        shell: bash
        run: |
          test -n "${SOP_PLUGIN_VALIDATOR}"
          test -f "${SOP_PLUGIN_VALIDATOR}"
          command -v codex
          command -v uv
          command -v git
          command -v go

      - name: Verify Git identity, rerun quality gates, build binaries, and assemble bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          go run ./cmd/sop-release gate \
            --source . \
            --plugin-root plugin \
            --output "${RUNNER_TEMP}/release-${{ matrix.target }}" \
            --version "${version}" \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --release-notes "Stable release ${GITHUB_REF_NAME} from ${GITHUB_SHA}" \
            --upgrade-impact "Updates versioned SOP rules, plugin, manager, and engine; project files remain unchanged until render" \
            --target-os "${{ matrix.goos }}" \
            --target-arch "${{ matrix.goarch }}"
          go run ./cmd/sop-release verify --bundle "${RUNNER_TEMP}/release-${{ matrix.target }}"

      - name: Upload verified tagged release bundle
        uses: actions/upload-artifact@v4
        with:
          name: sop-better-${{ github.ref_name }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release-${{ matrix.target }}
          if-no-files-found: error
